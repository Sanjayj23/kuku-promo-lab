<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="Kuku Promo Lab architecture: nine implemented stages from source ingestion to export and replay">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5E6B80"/></marker></defs>
<rect width="1600" height="980" fill="#0A0E14"/>
<text x="60" y="74" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2DD4BF" font-weight="700" text-anchor="start" letter-spacing="2.4" >KUKU PROMO LAB  ·  IMPLEMENTED ARCHITECTURE</text>
<text x="60" y="128" font-family="'Instrument Serif', Georgia, serif" font-size="34" fill="#F3EFE7" font-weight="400" text-anchor="start" letter-spacing="0" >Code decides what is valid. Models only judge. People decide what ships.</text>
<text x="60" y="166" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8692A4" font-weight="400" text-anchor="start" letter-spacing="0" >Each box names the module that implements it. Nothing on this diagram is proposed or simulated.</text>
